<main>
<section class="sz b hero" data-blocco="2.16 · 2"><div class="wrap st">
  <h1>Cosa dicono le persone che hanno venduto e comprato con noi</h1>
  <p class="lead">Recensioni di clienti delle tre sedi, divise tra chi ha venduto casa e chi l’ha comprata.</p>
  <div class="etichette"><a href="#chi-vende">Chi ha venduto casa</a><a href="#chi-compra">Chi ha comprato casa</a></div>
</div></section>
<section class="sz g" data-blocco="2.16 · 3" id="chi-vende"><div class="wrap">
  <div class="gruppo">
    <h2>Chi ha venduto casa</h2>
    <div class="grid c3">
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Ci hanno dato la valutazione scritta prima ancora di firmare qualcosa. Abbiamo deciso il prezzo con calma, e la casa è andata via in poche settimane.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-smiling-woman-outdoors_23-2147907068.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Giulia R.</span><span class="voce-dove">Treviglio</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Mi aggiornavano dopo ogni visita, senza che dovessi chiamare io. Sapevo sempre a che punto eravamo.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-modern-man_23-2147960990.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Marco B.</span><span class="voce-dove">Martinengo</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Il prezzo che ci avevano scritto nel report è stato quasi esattamente quello di vendita. Nessuna sorpresa a metà strada.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-smiley-woman_23-2148860584.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Anna V.</span><span class="voce-dove">Collecchio</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Avevamo provato da soli per un anno. Con loro, foto nuove e prezzo giusto: venduta in due mesi.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-man-laughing_23-2148859448.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Roberto e Lucia G.</span><span class="voce-dove">Calvenzano</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Vendevo la casa dei miei genitori, con una successione ancora aperta. Mi hanno detto quali documenti servivano prima di metterla in vendita.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/caucasian-woman-smiling-casual_53876-137684.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Franco D.</span><span class="voce-dove">Romano di Lombardia</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Le visite le filtravano loro: venivano solo persone che potevano davvero permettersela. Ne sono bastate poche.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/close-up-smiley-man-posing_23-2148563418.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Sara P.</span><span class="voce-dove">Noceto</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Mi hanno sconsigliato di alzare il prezzo «per trattare». Avevano ragione: offerta piena al primo mese.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/smiling-brunette-girl-posing-with-coat_23-2148135984.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Matteo L.</span><span class="voce-dove">Rivolta d’Adda</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Abitiamo lontano, non potevamo seguire le visite. Ci mandavano un resoconto scritto dopo ognuna.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-modern-man_23-2147961425.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Cristina A.</span><span class="voce-dove">Ghisalba</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Dal mandato al rogito ci ha seguiti la stessa agente. Una sola persona da chiamare, sempre.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/cheerful-young-redhead-woman-toothy-smiling_23-2148183281.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Giorgio M.</span><span class="voce-dove">Sala Baganza</span></span></figcaption></figure>
    </div>
  </div>
</div></section>
<section class="sz b" data-blocco="2.16 · 3-bis" id="chi-compra"><div class="wrap">
  <div class="gruppo">
    <h2>Chi ha comprato casa</h2>
    <div class="grid c3">
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Cercavamo da mesi. Ci hanno fatto vedere solo case nel nostro budget e nella zona che volevamo: alla terza visita abbiamo trovato.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/close-up-smiling-man-field-sunset_1140-222.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Elena e Paolo C.</span><span class="voce-dove">Collecchio</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Dal primo incontro al rogito ci ha seguiti la stessa persona. Ogni documento ce l’hanno spiegato prima di chiederci di firmarlo.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/smiley-woman-posing-yellow-dress-outside_23-2148728589.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Stefano M.</span><span class="voce-dove">Treviglio</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Abbiamo comprato la prima casa senza conoscere niente di mutui e notai. Ci hanno detto cosa fare, passo per passo.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/smiling-stubble-young-man-white-t-shirt-against-plain-wall_23-2148213411.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Laura T.</span><span class="voce-dove">Martinengo</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Venivamo da fuori e non conoscevamo i quartieri. L’agente ci ha spiegato le differenze tra le zone prima di farci vedere le case.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/vertical-shot-cute-pleasant-looking-woman-with-cheerful-expression-looks-happily-directly_273609-23457.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Davide e Sara F.</span><span class="voce-dove">Collecchio</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Mi hanno chiamato appena è entrata una casa con le caratteristiche che avevo chiesto, prima ancora che uscisse online.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-employee-happy-be-back-work_23-2148727615.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Alessandro N.</span><span class="voce-dove">Cologno al Serio</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Ci hanno detto con chiarezza anche i difetti della casa. Abbiamo comprato sapendo esattamente cosa ci aspettava.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/close-up-happy-young-woman_23-2148204712.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Monica e Luca B.</span><span class="voce-dove">Parma</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Avevo poco tempo per le visite. Me le hanno organizzate tutte in un sabato mattina.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/front-view-handsome-man-posing_23-2148692174.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Federica S.</span><span class="voce-dove">Casirate d’Adda</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Cercavamo una casa più piccola dopo la pensione. Ci hanno aiutato anche a vendere la nostra, nello stesso periodo.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/portrait-happy-young-woman-looking-camera_23-2147892777.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Gianni e Rosa P.</span><span class="voce-dove">Fornovo di Taro</span></span></figcaption></figure>
      <figure class="card voce"><span class="stelle" role="img" aria-label="5 stelle su 5"><span aria-hidden="true">★★★★★</span></span><blockquote><p>Per il mutuo ci hanno messo in contatto con un consulente. In tre settimane avevamo la delibera.</p></blockquote><figcaption class="voce-testa"><span class="ph voce-foto"><img src="https://img.magnific.com/free-photo/young-man-wearing-blue-outfit-looking-confident_1298-133.jpg" alt="" width="64" height="64" loading="lazy"><span>Foto</span></span><span class="voce-chi"><span class="voce-nome">Nicola R.</span><span class="voce-dove">Cortenuova</span></span></figcaption></figure>
    </div>
  </div>
</div></section>
