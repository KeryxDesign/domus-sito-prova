# Costruisce il sito di prova e lo pubblica su GitHub Pages senza salvare dati nel repo.
# Gli immobili si leggono da onOffice solo durante la build: finiscono nell'artefatto di Pages, mai in un commit.
# Senza i Secrets ONOFFICE_TOKEN e ONOFFICE_SECRET il sito si costruisce con sync/dati-finti.json.
# Articoli e domande frequenti si leggono da WordPress se la variabile del repo WORDPRESS_API è impostata (sync/wordpress.mjs).
name: Pubblica sito di prova
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5,12 * * *'   # due volte al giorno (UTC)
  # WordPress chiama questo evento quando Luana pubblica o modifica (vedi sync/README.md)
  repository_dispatch:
    types: [contenuti-aggiornati]
  workflow_dispatch:
    inputs:
      verifica:
        description: 'Solo verifica account onOffice (struttura e conteggi, niente pubblicazione)'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verifica:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verifica }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node sync/genera.mjs --verifica
        env:
          ONOFFICE_TOKEN: ${{ secrets.ONOFFICE_TOKEN }}
          ONOFFICE_SECRET: ${{ secrets.ONOFFICE_SECRET }}
  pubblica:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verifica) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # I dati veri entrano solo dopo la verifica: serve la variabile del repo ONOFFICE_ATTIVO = si
      - run: node sync/genera.mjs
        env:
          ONOFFICE_TOKEN: ${{ vars.ONOFFICE_ATTIVO == 'si' && secrets.ONOFFICE_TOKEN || '' }}
          ONOFFICE_SECRET: ${{ vars.ONOFFICE_ATTIVO == 'si' && secrets.ONOFFICE_SECRET || '' }}
          WORDPRESS_API: ${{ vars.WORDPRESS_API || 'https://darkslategray-scorpion-230635.hostingersite.com/cms/wp-json/wp/v2' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4

  # Copia del sito di prova su Hostinger (Keryx), su indirizzo di prova darkslategray-scorpion-230635.hostingersite.com, insieme a WordPress in /cms. Si carica con l'API di Hostinger (sync/hostinger.mjs).
  # Parte solo se c'è il Secret HOSTINGER_API_TOKEN. Le case vere seguono lo stesso interruttore ONOFFICE_ATTIVO di Pages (ok di DomuSync dato a Davide).
  hostinger:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verifica) }}
    runs-on: ubuntu-latest
    concurrency: { group: hostinger, cancel-in-progress: false }
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - if: ${{ env.HOSTINGER_API_TOKEN == '' }}
        run: echo "Manca il Secret HOSTINGER_API_TOKEN, niente copia su Hostinger."
      - if: ${{ env.HOSTINGER_API_TOKEN != '' }}
        uses: actions/checkout@v4
      - if: ${{ env.HOSTINGER_API_TOKEN != '' }}
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: ${{ env.HOSTINGER_API_TOKEN != '' }}
        run: node sync/genera.mjs
        env:
          ONOFFICE_TOKEN: ${{ vars.ONOFFICE_ATTIVO == 'si' && secrets.ONOFFICE_TOKEN || '' }}
          ONOFFICE_SECRET: ${{ vars.ONOFFICE_ATTIVO == 'si' && secrets.ONOFFICE_SECRET || '' }}
          WORDPRESS_API: ${{ vars.WORDPRESS_API || 'https://darkslategray-scorpion-230635.hostingersite.com/cms/wp-json/wp/v2' }}
      - if: ${{ env.HOSTINGER_API_TOKEN != '' }}
        run: node sync/hostinger.mjs ${{ vars.HOSTINGER_DOMINIO || 'darkslategray-scorpion-230635.hostingersite.com' }}
